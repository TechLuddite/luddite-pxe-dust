name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Unit tests and the repository checks in tests/test_repo.py: manifest and
  # entry points, no symlinks or agent instruction files, no hidden bidi
  # characters, PlainText on every QML Text, bounded process output, and the
  # marketplace scanner's file limits. The smoke scripts in tests/ need
  # installed Omarchy, dnsmasq, namespaces or an extracted ISO, and are not run.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install bsdtar for the archive extraction test
        run: sudo apt-get install -y --no-install-recommends libarchive-tools
      - run: python3 -m unittest discover -s tests -v

  # Luddite Scout reads the checkout: agent instruction files, hidden Unicode,
  # Actions, dependencies, build-time code and the Omarchy plugin rules. It
  # runs nothing from this repository. Fails on any HIGH or MEDIUM finding
  # that .scout-accepted.json does not list with a reason, on a listed entry
  # that no longer matches a finding, and on a check that could not finish.
  scout:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: TechLuddite/luddite-scout-action@b34b6a811b70e99c51a8e9b1f4a1aeecc786d99d
        with:
          fail-on: medium
          accepted: .scout-accepted.json
          name: ${{ github.repository }}
          commit: ${{ github.event.pull_request.head.sha || github.sha }}

  # The marketplace's own Automated Security Baseline, the scan a submission
  # gets, run against the pushed commit. A plugin with a root helper always
  # reports review capabilities, so the outcome is `review-required` at best.
  # Fails on a `failed` outcome, on any finding, and on a capability that is
  # not in ACCEPTED_CAPABILITIES. A new capability means the plugin gained a
  # kind of access, and adding it to the list is the review.
  baseline:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    env:
      MARKETPLACE_REPO: https://github.com/omacom/omarchy-plugin-marketplace
      MARKETPLACE_SHA: fd5874893f5f4690570d2d88e8bcfb6df9f30184
      ACCEPTED_CAPABILITIES: installer package-manager privilege service-management
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Fetch the marketplace scanner at a pinned commit
        run: |
          git init -q marketplace
          git -C marketplace -c core.hooksPath=/dev/null fetch -q --depth 1 -- "$MARKETPLACE_REPO" "$MARKETPLACE_SHA"
          test "$(git -C marketplace rev-parse 'FETCH_HEAD^{commit}')" = "$MARKETPLACE_SHA"
          git -C marketplace -c core.hooksPath=/dev/null -c advice.detachedHead=false checkout -q FETCH_HEAD
          cd marketplace && npm ci --ignore-scripts --no-audit --no-fund
      - name: Run the security baseline
        working-directory: marketplace
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module -e '
          import { runSecurityBaseline } from "./scripts/security-baseline-scanner.mjs";
          const r = await runSecurityBaseline(
            `https://github.com/${process.env.GITHUB_REPOSITORY}`, process.env.GITHUB_SHA,
            { token: process.env.GITHUB_TOKEN, requiredPaths: ["manifest.json"] });
          console.log(JSON.stringify({ outcome: r.outcome, findings: r.findings, capabilities: r.capabilities }, null, 2));
          const accepted = new Set(process.env.ACCEPTED_CAPABILITIES.split(/\s+/).filter(Boolean));
          const extra = (r.capabilities || []).map((c) => c.id).filter((id) => !accepted.has(id));
          if (extra.length) console.log(`Capabilities not in ACCEPTED_CAPABILITIES: ${extra.join(", ")}`);
          const ok = ["passed", "review-required"].includes(r.outcome) && !(r.findings || []).length && !extra.length;
          process.exit(ok ? 0 : 1);'
